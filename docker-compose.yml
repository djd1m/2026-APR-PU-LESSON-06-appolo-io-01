services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: salesradar
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/salesradar
      SECRET_KEY: change-me-in-production
      DEBUG: "true"
      PAYMENTS_STUB: "true"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
